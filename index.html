.tagline{display:inline-flex;gap:.5rem;align-items:center;font:600 .78rem Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}

.btn.wa{background:var(--wa);color:#05260f;width:100%;font-size:1.02rem;padding:1.05rem}.btn.wa:hover{background:#1fbb5a}
.scene{position:relative;height:clamp(230px,44vw,380px);cursor:pointer;overflow:hidden;border-radius:28px;background:linear-gradient(180deg,#eaf2ff,#f8fbff 70%)}
.sun{position:absolute;right:10%;top:12%;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,#fff,#cfe3ff 70%);animation:pulse 5s ease-in-out infinite}
.road{position:absolute;left:0;right:0;bottom:0;height:22%;background:var(--navy)}
.road::before{content:"";position:absolute;left:0;right:0;top:48%;height:4px;background:repeating-linear-gradient(90deg,#fff 0 36px,transparent 36px 72px);animation:dash .55s linear infinite}
.carwrap{position:absolute;left:50%;bottom:12%;width:min(88%,520px);translate:-50% 0}
.carwrap img{width:100%;display:block;mix-blend-mode:multiply;animation:drive 1.7s cubic-bezier(.12,.8,.2,1) both,bob 1.3s 1.7s ease-in-out infinite}
.streak{position:absolute;left:0;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,var(--blue2));opacity:0;animation:streak 1.5s ease-out both}

.scene.again .carwrap img{animation:none}.scene.again .streak{animation:none}

@keyframes dash{to{background-position:-72px 0}}
@keyframes streak{0%{transform:translateX(-30%);opacity:0}25%{opacity:.9}100%{transform:translateX(160%);opacity:0}}

select,input:not([type=checkbox]){width:100%;padding:.85rem 1rem;font:inherit;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}

.rv{opacity:0;transform:translateY(26px);clip-path:inset(0 0 12% 0 round 20px)}

.body{padding:1.2rem 1.4rem 1.4rem;display:flex;flex-direction:column;gap:.8rem;flex:1}

.car .btn{width:100%}
.three{display:grid;gap:1.2rem;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.why{background:#fff;border:1px solid var(--line);border-radius:20px;padding:1.6rem}

  f_all:'All', eco:'Economy', compact:'Compact', suv:'SUV / Family', sport:'Sport', per_day:'/ day', manual:'Manual', auto:'Automatic', petrol:'Petrol', diesel:'Diesel', seats:'{n} seats', ac:'A/C', book:'Book',
  why_t:'Why Madine Car', w1p:'A clear choice and a booking in a few messages.', w2p:'Quick WhatsApp confirmation, car ready on arrival.', w3p:'Well-kept cars and a team available when you need it.',
  form_t:'Your booking', name:'Full name', phone:'WhatsApp / Phone', pickup:'Pickup location', from:'Start date', to:'Return date', car:'Car', choose:'Choose…',
  days:'Duration', days_n:'{n} day(s)', total:'Estimated total', send:'Book via WhatsApp', err:'Pick a car and a return date after the start date.',
  note:'Estimate. The final price and any delivery fee are confirmed on WhatsApp.',
  terms_t:'Terms', t1:'<b>Minimum age:</b> {min} years.', t2:'<b>Licence:</b> valid for at least {y} years + ID or passport.', t3:'<b>Deposit:</b> {dep}, refunded on return.', t4:'<b>Delivery:</b> available on request.',
  q:[['How do I book?','Pick a car, fill in the form and send it on WhatsApp.'],['Which documents do I need?','A valid licence and an ID card or passport.'],['Do you deliver to the airport?','Yes, on request. Mention the place in your booking.'],['Can I cancel?','Tell us as early as possible on WhatsApp.']],
  loc_t:'Find us', loc_p:'Sidi Bernoussi, Casablanca.', map:'View on Google Maps', footer:'Car rental — Casablanca',
  w_head:'Booking request', w_car:'Car', w_pick:'Pickup', w_dates:'Dates', w_days:'Duration', w_total:'Estimated total', w_client:'Client', w_tel:'Tel' }
};

/* ============ LOGIC ============ */
const $ = s => document.querySelector(s);
let lang = 'fr', cat = 'all';
const t = (k, p = {}) => String(T[lang][k] ?? k).replace(/\{(\w+)\}/g, (_, x) => p[x] ?? '');
const money = n => n.toLocaleString(lang === 'fr' ? 'fr-FR' : 'en-US') + (lang === 'fr' ? ' DH' : ' MAD');
const carOf = id => C.cars.find(c => c.id === id);
const nDays = () => { const a = new Date($('#from').value), b = new Date($('#to').value); return isNaN(a) || isNaN(b) ? 0 : Math.round((b - a) / 864e5); };
const FALLBACK = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100"><rect width="160" height="100" fill="#e6eef9"/><path d="M26 64l12-24c2-4 5-6 10-6h64c5 0 8 2 10 6l12 24v12H26z" fill="#1677E5"/><path d="M52 40h56l8 16H44z" fill="#cfe3ff"/><circle cx="50" cy="76" r="9" fill="#0A1F44"/><circle cx="110" cy="76" r="9" fill="#0A1F44"/></svg>');

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(e => { const v = t(e.dataset.t); e.dataset.t === 'h1' ? e.innerHTML = v : e.textContent = v; });
  $('#lang').innerHTML = ['fr', 'en'].map(l => `<button type="button" data-l="${l}" aria-pressed="${l === lang}">${l.toUpperCase()}</button>`).join('');
  const r = C.rules;
  $('#terms').innerHTML = [1, 2, 3, 4].map(i => `<li>${t('t' + i, { min: r.minAge, y: r.years, dep: r.deposit })}</li>`).join('');
  $('#faqList').innerHTML = T[lang].q.map(q => `<details><summary>${q[0]}</summary><p>${q[1]}</p></details>`).join('');
  const kl = $('#loc').value, kc = $('#car').value;
  $('#loc').innerHTML = C.locs.map(l => `<option value="${l.id}">${l[lang]}</option>`).join('');
  if (kl) $('#loc').value = kl;
  $('#car').innerHTML = `<option value="">${t('choose')}</option>` + C.cars.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  if (kc) $('#car').value = kc;
  const cats = ['all', ...new Set(C.cars.map(c => c.cat))];
  $('#chips').innerHTML = cats.map(k => `<button type="button" data-c="${k}" aria-pressed="${k === cat}">${t(k === 'all' ? 'f_all' : k)}</button>`).join('');
  renderCars(); calc(); observe();
}
function renderCars() {
  $('#cars').innerHTML = C.cars.filter(c => cat === 'all' || c.cat === cat).map((c, i) => `
    <article class="car rv" style="--d:${i * 90}ms">
      <div class="ph"><span class="tag">${t(c.cat)}</span><img src="${c.img || FALLBACK}" alt="${c.name}" loading="lazy" onerror="this.onerror=null;this.src=FALLBACK"></div>
      <div class="body"><h3>${c.name}</h3>
        <div class="specs"><span>${t(c.gb)}</span><span>${t(c.fuel)}</span><span>${t('seats', { n: c.seats })}</span><span>${t('ac')}</span></div>
        <div class="price"><strong>${money(c.price)}</strong> <small>${t('per_day')}</small></div>
        <button class="btn" type="button" data-book="${c.id}">${t('book')}</button></div></article>`).join('');
}
function calc() {
  const n = nDays(), car = carOf($('#car').value), ok = n > 0 && car;
  $('#sDays').textContent = n > 0 ? t('days_n', { n }) : '—';
  $('#sTotal').textContent = ok ? money(car.price * n) : '—';
  return ok ? { n, car, total: car.price * n } : null;
}
document.addEventListener('click', e => {
  const l = e.target.closest('[data-l]'), c = e.target.closest('[data-c]'), b = e.target.closest('[data-book]');
  if (l) { lang = l.dataset.l; applyLang(); }
  if (c) { cat = c.dataset.c; applyLang(); }
  if (b) { $('#car').value = b.dataset.book; calc(); $('#book').scrollIntoView(); }
});
['#loc', '#car', '#from', '#to'].forEach(s => $(s).addEventListener('change', () => { if (s === '#from') $('#to').min = $('#from').value; $('#err').hidden = true; calc(); }));
$('#form').addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target; if (!f.reportValidity()) return;
  const r = calc(); if (!r) { $('#err').textContent = t('err'); $('#err').hidden = false; return; }
  const fd = Object.fromEntries(new FormData(f)), loc = C.locs.find(l => l.id === fd.loc);
  const d = v => new Date(v).toLocaleDateString(lang === 'fr' ? 'fr-FR' : 'en-GB');
  const msg = [`*MADINE CAR* — ${t('w_head')}`, '', `${t('w_car')}: ${r.car.name}`, `${t('w_pick')}: ${loc[lang]}`, `${t('w_dates')}: ${d(fd.from)} → ${d(fd.to)}`,
    `${t('w_days')}: ${t('days_n', { n: r.n })}`, `${t('w_total')}: ${money(r.total)}`, '', `${t('w_client')}: ${fd.name.trim()}`, `${t('w_tel')}: ${fd.phone.trim()}`].join('\n');
  window.open(`https://wa.me/${C.wa}?text=${encodeURIComponent(msg)}`, '_blank', 'noopener');
});
// replay the driving animation on click
$('#scene').addEventListener('click', () => {
  const s = $('#scene'); s.classList.add('again'); void s.offsetWidth; s.classList.remove('again');
});
let io;
function observe() {
  io = io || new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add('in'); io.unobserve(x.target); } }), { threshold: .12 });
  document.querySelectorAll('.rv:not(.in)').forEach(el => io.observe(el));
}
$('#mapBtn').href = C.map;
const today = new Date().toISOString().split('T')[0]; $('#from').min = today; $('#to').min = today;
applyLang();
</script>
</body>
</html>
